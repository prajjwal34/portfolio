<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="xlsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="100%" stop-color="#0f2336"/>
    </linearGradient>
    <linearGradient id="xlsGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#xlsBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Excel Top Ribbon -->
  <rect width="800" height="50" rx="16" fill="#064e3b"/>
  <rect y="30" width="800" height="20" fill="#064e3b"/>
  <line x1="0" y1="50" x2="800" y2="50" stroke="#047857" stroke-width="1"/>

  <circle cx="30" cy="25" r="6" fill="#ef4444"/>
  <circle cx="50" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="30" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="bold">Microsoft Excel | Automated Financial & Operations KPI Dashboard</text>
  <rect x="670" y="14" width="100" height="24" rx="12" fill="#047857"/>
  <text x="720" y="30" fill="#ecfdf5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">.XLSX</text>

  <!-- Formula Bar -->
  <rect x="20" y="60" width="760" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="35" y="81" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">fx</text>
  <line x1="55" y1="65" x2="55" y2="87" stroke="#334155"/>
  <text x="65" y="81" fill="#38bdf8" font-family="monospace" font-size="11">=XLOOKUP(D5, SalesData[ID], SalesData[Revenue], "N/A") * (1 - BudgetVar)</text>

  <!-- Left Slicers (Interactive Excel Slicers) -->
  <rect x="20" y="105" width="160" height="375" rx="10" fill="#0b1728" stroke="#1e293b"/>
  <rect x="20" y="105" width="160" height="30" rx="10" fill="#1e293b"/>
  <text x="35" y="125" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">DEPARTMENT SLICER</text>
  
  <rect x="30" y="145" width="140" height="26" rx="4" fill="#059669"/>
  <text x="40" y="162" fill="#fff" font-family="sans-serif" font-size="11">✓ Operations</text>
  
  <rect x="30" y="180" width="140" height="26" rx="4" fill="#132338"/>
  <text x="40" y="197" fill="#94a3b8" font-family="sans-serif" font-size="11">Marketing</text>

  <rect x="30" y="215" width="140" height="26" rx="4" fill="#132338"/>
  <text x="40" y="232" fill="#94a3b8" font-family="sans-serif" font-size="11">Engineering</text>

  <rect x="30" y="250" width="140" height="26" rx="4" fill="#132338"/>
  <text x="40" y="267" fill="#94a3b8" font-family="sans-serif" font-size="11">Human Resources</text>

  <rect x="20" y="300" width="160" height="28" fill="#1e293b"/>
  <text x="35" y="318" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">FISCAL QUARTER</text>
  <rect x="30" y="338" width="65" height="24" rx="4" fill="#059669"/>
  <text x="50" y="354" fill="#fff" font-family="sans-serif" font-size="10">Q1</text>
  <rect x="105" y="338" width="65" height="24" rx="4" fill="#059669"/>
  <text x="125" y="354" fill="#fff" font-family="sans-serif" font-size="10">Q2</text>
  <rect x="30" y="370" width="65" height="24" rx="4" fill="#132338"/>
  <text x="50" y="386" fill="#94a3b8" font-family="sans-serif" font-size="10">Q3</text>
  <rect x="105" y="370" width="65" height="24" rx="4" fill="#132338"/>
  <text x="125" y="386" fill="#94a3b8" font-family="sans-serif" font-size="10">Q4</text>

  <!-- Middle 3 KPI Cards -->
  <rect x="200" y="105" width="180" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="215" y="128" fill="#94a3b8" font-family="sans-serif" font-size="11">TIME SAVED</text>
  <text x="215" y="160" fill="#22c55e" font-family="sans-serif" font-size="22" font-weight="bold">12 Hrs / Wk</text>
  <text x="215" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10">Zero Manual Entry</text>

  <rect x="395" y="105" width="180" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="410" y="128" fill="#94a3b8" font-family="sans-serif" font-size="11">BUDGET VARIANCE</text>
  <text x="410" y="160" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">±2.1%</text>
  <text x="410" y="178" fill="#10b981" font-family="sans-serif" font-size="10">Within Tolerance</text>

  <rect x="590" y="105" width="190" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="605" y="128" fill="#94a3b8" font-family="sans-serif" font-size="11">FORMULAS AUTOMATED</text>
  <text x="605" y="160" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold">45+ Models</text>
  <text x="605" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10">Dynamic Array Formulas</text>

  <!-- Budget vs Actual Chart -->
  <rect x="200" y="205" width="375" height="275" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="215" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Budget Allocation vs Actual Expenditure</text>

  <g transform="translate(230, 260)">
    <!-- Bar 1 -->
    <rect x="10" y="60" width="22" height="120" rx="3" fill="#334155"/>
    <rect x="36" y="40" width="22" height="140" rx="3" fill="url(#xlsGreen)"/>
    <text x="35" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Jan</text>

    <!-- Bar 2 -->
    <rect x="80" y="50" width="22" height="130" rx="3" fill="#334155"/>
    <rect x="106" y="30" width="22" height="150" rx="3" fill="url(#xlsGreen)"/>
    <text x="105" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Feb</text>

    <!-- Bar 3 -->
    <rect x="150" y="70" width="22" height="110" rx="3" fill="#334155"/>
    <rect x="176" y="55" width="22" height="125" rx="3" fill="url(#xlsGreen)"/>
    <text x="175" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Mar</text>

    <!-- Bar 4 -->
    <rect x="220" y="40" width="22" height="140" rx="3" fill="#334155"/>
    <rect x="246" y="20" width="22" height="160" rx="3" fill="url(#xlsGreen)"/>
    <text x="245" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Apr</text>
  </g>

  <!-- Right: PivotTable Summary -->
  <rect x="590" y="205" width="190" height="275" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="605" y="230" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Pivot Summary</text>

  <rect x="605" y="245" width="160" height="20" fill="#1e293b"/>
  <text x="612" y="259" fill="#94a3b8" font-family="sans-serif" font-size="10">Cost Center</text>
  <text x="730" y="259" fill="#94a3b8" font-family="sans-serif" font-size="10">Total</text>

  <text x="612" y="285" fill="#e2e8f0" font-family="sans-serif" font-size="10">Cloud Infra</text>
  <text x="725" y="285" fill="#38bdf8" font-family="monospace" font-size="10">₹3.4L</text>

  <text x="612" y="315" fill="#e2e8f0" font-family="sans-serif" font-size="10">Software</text>
  <text x="725" y="315" fill="#38bdf8" font-family="monospace" font-size="10">₹1.8L</text>

  <text x="612" y="345" fill="#e2e8f0" font-family="sans-serif" font-size="10">Marketing</text>
  <text x="725" y="345" fill="#38bdf8" font-family="monospace" font-size="10">₹2.6L</text>

  <line x1="605" y1="365" x2="765" y2="365" stroke="#334155"/>
  <text x="612" y="390" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">Grand Total</text>
  <text x="720" y="390" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">₹7.8L</text>
</svg>
