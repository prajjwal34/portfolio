<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326"/>
      <stop offset="100%" stop-color="#181a38"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#hrBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Bar -->
  <rect width="800" height="50" rx="16" fill="#0f172a"/>
  <rect y="30" width="800" height="20" fill="#0f172a"/>
  <line x1="0" y1="50" x2="800" y2="50" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="30" cy="25" r="6" fill="#ef4444"/>
  <circle cx="50" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="30" fill="#c7d2fe" font-family="sans-serif" font-size="13" font-weight="600">Power BI | HR Analytics & Employee Attrition Diagnostic</text>
  <rect x="660" y="14" width="110" height="24" rx="12" fill="#1e293b"/>
  <text x="715" y="30" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HR REPORT</text>

  <!-- 4 Top KPI Cards -->
  <rect x="25" y="70" width="170" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="40" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">TOTAL HEADCOUNT</text>
  <text x="40" y="128" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">1,470</text>
  <text x="40" y="145" fill="#10b981" font-family="sans-serif" font-size="10">Active Staff</text>

  <rect x="215" y="70" width="170" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="230" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">ATTRITION RATE</text>
  <text x="230" y="128" fill="#f43f5e" font-family="sans-serif" font-size="22" font-weight="bold">16.1%</text>
  <text x="230" y="145" fill="#f43f5e" font-family="sans-serif" font-size="10">237 Exits Total</text>

  <rect x="405" y="70" width="170" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="420" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">AVG MONTHLY INCOME</text>
  <text x="420" y="128" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">₹65,020</text>
  <text x="420" y="145" fill="#94a3b8" font-family="sans-serif" font-size="10">Median: ₹58K</text>

  <rect x="595" y="70" width="180" height="85" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="610" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">SATISFACTION SCORE</text>
  <text x="610" y="128" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold">3.8 / 5</text>
  <text x="610" y="145" fill="#94a3b8" font-family="sans-serif" font-size="10">Work-Life Balance</text>

  <!-- Left: Department Attrition Bar Chart -->
  <rect x="25" y="175" width="460" height="300" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="45" y="205" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Attrition by Department (%)</text>
  
  <text x="45" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11">Sales</text>
  <rect x="150" y="228" width="260" height="18" rx="4" fill="#f43f5e" opacity="0.85"/>
  <text x="420" y="242" fill="#fff" font-family="monospace" font-size="11">20.6%</text>

  <text x="45" y="280" fill="#94a3b8" font-family="sans-serif" font-size="11">R&amp;D</text>
  <rect x="150" y="268" width="180" height="18" rx="4" fill="url(#purplePink)"/>
  <text x="340" y="282" fill="#fff" font-family="monospace" font-size="11">13.8%</text>

  <text x="45" y="320" fill="#94a3b8" font-family="sans-serif" font-size="11">HR</text>
  <rect x="150" y="308" width="240" height="18" rx="4" fill="#f59e0b" opacity="0.85"/>
  <text x="400" y="322" fill="#fff" font-family="monospace" font-size="11">19.0%</text>

  <!-- Overtime impact highlight -->
  <rect x="45" y="360" width="420" height="95" rx="8" fill="#070d1e" stroke="#334155"/>
  <text x="60" y="385" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">OVERTIME ATTRITION INSIGHT</text>
  <text x="60" y="410" fill="#e2e8f0" font-family="sans-serif" font-size="12">Frequent Overtime Staff: <tspan fill="#f43f5e" font-weight="bold">31% Attrition</tspan></text>
  <text x="60" y="435" fill="#e2e8f0" font-family="sans-serif" font-size="12">Standard 40-hr Staff: <tspan fill="#22c55e" font-weight="bold">10% Attrition</tspan></text>

  <!-- Right: Tenure & Education donut -->
  <rect x="505" y="175" width="270" height="300" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="520" y="205" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Years at Company</text>
  
  <circle cx="640" cy="285" r="54" fill="none" stroke="#1e293b" stroke-width="20"/>
  <circle cx="640" cy="285" r="54" fill="none" stroke="#f43f5e" stroke-width="20" stroke-dasharray="140 340" stroke-dashoffset="0"/>
  <circle cx="640" cy="285" r="54" fill="none" stroke="#6366f1" stroke-width="20" stroke-dasharray="110 340" stroke-dashoffset="-140"/>
  <circle cx="640" cy="285" r="54" fill="none" stroke="#2dd4bf" stroke-width="20" stroke-dasharray="90 340" stroke-dashoffset="-250"/>

  <text x="640" y="285" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">&lt; 2 Yrs</text>
  <text x="640" y="302" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">44%</text>

  <rect x="520" y="380" width="240" height="80" rx="6" fill="#0b1329"/>
  <text x="530" y="402" fill="#cbd5e1" font-family="sans-serif" font-size="11">■ &lt; 2 Years (44% Attrition)</text>
  <text x="530" y="424" fill="#cbd5e1" font-family="sans-serif" font-size="11">■ 2 - 5 Years (32%)</text>
  <text x="530" y="446" fill="#cbd5e1" font-family="sans-serif" font-size="11">■ 5+ Years (24%)</text>
</svg>
