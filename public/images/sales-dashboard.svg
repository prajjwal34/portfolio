<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pbiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#pbiBg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Top App Header -->
  <rect width="800" height="50" rx="16" fill="#0f172a"/>
  <rect y="30" width="800" height="20" fill="#0f172a"/>
  <line x1="0" y1="50" x2="800" y2="50" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window dots -->
  <circle cx="30" cy="25" r="6" fill="#ef4444"/>
  <circle cx="50" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="70" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="30" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">Power BI | Executive Sales Performance Analysis</text>
  <rect x="660" y="14" width="110" height="24" rx="12" fill="#1e293b"/>
  <text x="715" y="30" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LIVE DATA</text>

  <!-- Left Slicers Panel -->
  <rect x="20" y="70" width="160" height="410" rx="10" fill="#0c1631" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="100" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">REGION FILTER</text>
  <rect x="35" y="115" width="130" height="28" rx="6" fill="#0284c7" opacity="0.3"/>
  <text x="45" y="134" fill="#38bdf8" font-family="sans-serif" font-size="12">✔ All Regions</text>
  <text x="45" y="165" fill="#64748b" font-family="sans-serif" font-size="12">North Region</text>
  <text x="45" y="195" fill="#64748b" font-family="sans-serif" font-size="12">South Region</text>
  <text x="45" y="225" fill="#64748b" font-family="sans-serif" font-size="12">West Region</text>
  
  <text x="35" y="275" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">TIME PERIOD</text>
  <rect x="35" y="290" width="130" height="26" rx="4" fill="#1e293b"/>
  <text x="45" y="307" fill="#cbd5e1" font-family="sans-serif" font-size="11">FY 2023 - 2024 ▾</text>

  <!-- 3 Top KPI Cards -->
  <!-- KPI 1 -->
  <rect x="200" y="70" width="180" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="215" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TOTAL REVENUE</text>
  <text x="215" y="130" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">₹4,824,500</text>
  <text x="215" y="148" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">▲ +18.2% YoY</text>

  <!-- KPI 2 -->
  <rect x="395" y="70" width="180" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="410" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">NET PROFIT MARGIN</text>
  <text x="410" y="130" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="bold">24.6%</text>
  <text x="410" y="148" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600">▲ +3.4% Target</text>

  <!-- KPI 3 -->
  <rect x="590" y="70" width="190" height="90" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="605" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">TRANSACTIONS</text>
  <text x="605" y="130" fill="#2dd4bf" font-family="sans-serif" font-size="24" font-weight="bold">52,410</text>
  <text x="605" y="148" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Avg ₹92/order</text>

  <!-- Chart 1: Monthly Revenue Trend (Line & Area) -->
  <rect x="200" y="175" width="375" height="175" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="215" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Monthly Sales & Trend (₹)</text>
  <!-- Area fill -->
  <path d="M220 315 L260 280 L300 295 L340 260 L380 270 L420 230 L460 240 L500 215 L540 220 L550 210 L550 325 L220 325 Z" fill="#0284c7" opacity="0.2"/>
  <!-- Stroke Line -->
  <path d="M220 315 L260 280 L300 295 L340 260 L380 270 L420 230 L460 240 L500 215 L540 220 L550 210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Data dots -->
  <circle cx="260" cy="280" r="4" fill="#38bdf8"/>
  <circle cx="340" cy="260" r="4" fill="#38bdf8"/>
  <circle cx="420" cy="230" r="4" fill="#38bdf8"/>
  <circle cx="500" cy="215" r="4" fill="#38bdf8"/>
  <circle cx="550" cy="210" r="5" fill="#2dd4bf"/>

  <!-- Chart 2: Category Breakdown (Donut) -->
  <rect x="590" y="175" width="190" height="175" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="605" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Product Category</text>
  <circle cx="685" cy="265" r="48" fill="none" stroke="#1e293b" stroke-width="18"/>
  <circle cx="685" cy="265" r="48" fill="none" stroke="#38bdf8" stroke-width="18" stroke-dasharray="145 300" stroke-dashoffset="0"/>
  <circle cx="685" cy="265" r="48" fill="none" stroke="#2dd4bf" stroke-width="18" stroke-dasharray="90 300" stroke-dashoffset="-150"/>
  <circle cx="685" cy="265" r="48" fill="none" stroke="#818cf8" stroke-width="18" stroke-dasharray="60 300" stroke-dashoffset="-245"/>
  <text x="685" y="270" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">48%</text>
  <text x="685" y="284" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Tech</text>

  <!-- Bottom Regional Bar Chart -->
  <rect x="200" y="365" width="580" height="115" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="215" y="390" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Regional Revenue Contribution</text>
  
  <text x="215" y="420" fill="#94a3b8" font-family="sans-serif" font-size="11">North</text>
  <rect x="260" y="410" width="360" height="12" rx="4" fill="url(#barGrad)"/>
  <text x="630" y="420" fill="#f8fafc" font-family="monospace" font-size="11">₹1.85M</text>

  <text x="215" y="445" fill="#94a3b8" font-family="sans-serif" font-size="11">West</text>
  <rect x="260" y="435" width="280" height="12" rx="4" fill="url(#accentTeal)"/>
  <text x="550" y="445" fill="#f8fafc" font-family="monospace" font-size="11">₹1.42M</text>

  <text x="215" y="470" fill="#94a3b8" font-family="sans-serif" font-size="11">South</text>
  <rect x="260" y="460" width="210" height="12" rx="4" fill="#6366f1"/>
  <text x="480" y="470" fill="#f8fafc" font-family="monospace" font-size="11">₹1.05M</text>
</svg>
