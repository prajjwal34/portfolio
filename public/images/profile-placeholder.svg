<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="50" y1="0" x2="50" y2="600" stroke-dasharray="4,4"/>
    <line x1="150" y1="0" x2="150" y2="600" stroke-dasharray="4,4"/>
    <line x1="250" y1="0" x2="250" y2="600" stroke-dasharray="4,4"/>
    <line x1="350" y1="0" x2="350" y2="600" stroke-dasharray="4,4"/>
    <line x1="450" y1="0" x2="450" y2="600" stroke-dasharray="4,4"/>
    <line x1="550" y1="0" x2="550" y2="600" stroke-dasharray="4,4"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke-dasharray="4,4"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke-dasharray="4,4"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke-dasharray="4,4"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke-dasharray="4,4"/>
    <line x1="0" y1="500" x2="600" y2="500" stroke-dasharray="4,4"/>
  </g>

  <!-- Glowing Ring -->
  <circle cx="300" cy="270" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" opacity="0.8"/>
  <circle cx="300" cy="270" r="130" fill="#0b1730" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Stylized Modern Avatar Silhouette -->
  <g fill="#94a3b8">
    <!-- Head -->
    <circle cx="300" cy="230" r="54" fill="#38bdf8" opacity="0.85"/>
    <circle cx="300" cy="230" r="48" fill="#1e293b"/>
    <!-- Headset / Glasses / Tech element -->
    <path d="M260 225 Q300 240 340 225" stroke="#38bdf8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="280" cy="225" r="10" fill="#0284c7"/>
    <circle cx="320" cy="225" r="10" fill="#0284c7"/>
    <!-- Shoulders / Torso -->
    <path d="M200 370 C200 305 240 290 300 290 C360 290 400 305 400 370 Z" fill="url(#accentGrad)" opacity="0.9"/>
  </g>

  <!-- Data Visual Overlay Icons -->
  <g transform="translate(140, 160)">
    <rect width="64" height="48" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="16" y1="36" x2="16" y2="22" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="28" y1="36" x2="28" y2="16" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="36" x2="40" y2="28" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="36" x2="50" y2="12" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(390, 180)">
    <rect width="70" height="42" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="35" y="26" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">SQL_OK</text>
  </g>

  <!-- Bottom Tag Badge -->
  <g transform="translate(100, 470)">
    <rect width="400" height="74" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="200" y="32" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
      YOUR PROFILE PHOTO
    </text>
    <text x="200" y="54" fill="#38bdf8" font-family="monospace" font-size="13" text-anchor="middle">
      Replace with /public/images/profile.jpg
    </text>
  </g>
</svg>
